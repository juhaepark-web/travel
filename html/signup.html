<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>회원가입 | 여행의 쉼표</title><link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/public.css"><link rel="stylesheet" href="/css/account.css"><script src="/js/common.js" defer></script><script type="module" src="/js/auth.js"></script></head><body class="auth-page"><header class="header wrap"><a class="brand" href="/index.html">여행의 쉼표<span class="brand-dot">.</span></a><button class="menu-toggle" aria-expanded="false" aria-controls="navigation">메뉴</button><nav id="navigation" aria-label="주 메뉴"><a href="/#destinations">여행지 둘러보기</a><a href="/#stays">주변 숙소</a><a href="/#guide">이용 안내</a><div id="account-menu" class="account-menu"><a class="login" href="/html/signup.html">회원가입</a><a class="login" href="/html/login.html">로그인</a><a class="login" href="/html/admin-login.html">관리자</a></div></nav></header><main class="auth-shell"><span class="eyebrow">YOUR JOURNEY STARTS HERE</span><h1>회원가입</h1><p>새로운 여행을 위한 첫걸음. 회원 정보를 입력해 주세요.</p><form id="auth-form" data-mode="signup"><label class="field">이름<input name="name" required maxlength="60" autocomplete="name"></label><label class="field">연락처<input name="phone" type="tel" required maxlength="30" pattern="[0-9+() \-]{8,30}" autocomplete="tel" placeholder="010-1234-5678"></label><label class="field">이메일<input name="email" type="email" required maxlength="254" autocomplete="username"></label><label class="field" data-password-field>비밀번호<input name="password" type="password" required minlength="6" autocomplete="new-password" maxlength="128"></label><label class="field" data-password-field>비밀번호 확인<input name="confirmPassword" type="password" required minlength="6" maxlength="128" autocomplete="new-password"><small>비밀번호는 Firebase Authentication에서만 처리합니다.</small></label><p id="form-status" class="form-status" role="status">연결 상태 확인 중…</p><button type="submit" class="primary">회원가입</button></form><div class="auth-links"><a href="/html/signup.html">회원가입</a><a href="/html/login.html">로그인</a><a href="/index.html">홈으로</a></div></main></body></html>
