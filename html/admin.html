<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>관리자 대시보드 | 여행의 쉼표</title><link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/account.css"><link rel="stylesheet" href="/css/admin.css"><script type="module" src="/js/admin/dashboard.js"></script></head>
<body class="admin-body"><header class="admin-header"><a class="brand" href="/index.html">여행의 쉼표<span class="brand-dot">.</span><small>ADMINISTRATION</small></a><div id="account-menu" class="account-menu"></div></header>
<main id="access-gate" class="wrap access-gate"><span class="eyebrow">PROTECTED AREA</span><h1>관리자 권한을 확인하고 있습니다.</h1><p id="access-status" role="status">인증된 관리자만 운영 정보를 조회할 수 있습니다.</p><a href="/html/admin-login.html">관리자 로그인으로 이동 →</a></main>
<div class="admin-shell" id="admin-shell" hidden><aside class="admin-sidebar"><span class="eyebrow">WORKSPACE</span><nav class="admin-tabs" aria-label="관리 메뉴"><button data-tab="overview" class="active" aria-current="page">대시보드</button><button data-tab="destinations">여행지 등록/수정/삭제</button><button data-tab="stays">숙소 등록/수정/삭제</button><button data-tab="reservations">예약 확인</button><button data-tab="members">회원정보</button></nav></aside>
<main class="admin-main"><span class="eyebrow">TRAVEL MANAGEMENT</span><h1 id="panel-title">운영 현황</h1><p id="admin-status" role="status">데이터를 불러오고 있습니다.</p><div class="toolbar"><input id="admin-search" type="search" placeholder="이름, 이메일, 예약번호 검색" aria-label="관리 목록 검색"><select id="admin-filter" aria-label="상태 필터"><option value="all">전체 상태</option></select><button class="secondary" id="reload-data">새로고침</button><button class="primary" id="new-item" hidden>새 항목 등록</button></div><section id="overview"><div class="metric-grid" id="metrics"></div><div class="admin-summary" id="booking-summary"></div><div class="admin-panel-title"><h2>최근 예약</h2><span class="badge">최근 10건</span></div></section><div id="admin-table" class="table-wrap"></div><p class="admin-footer">삭제는 숨김·비활성화로 처리하여 예약 기록을 보존합니다. 예약 확정 전 숙소 가능 여부를 별도로 확인해 주세요.</p></main></div>
<dialog class="dialog-wide" id="editor-dialog" aria-labelledby="editor-title"><div class="dialog-head"><h2 id="editor-title">등록</h2><button type="button" data-close="editor-dialog" aria-label="편집 닫기">✕</button></div><form id="editor-form"><div id="editor-fields"></div><p id="editor-status" role="status" class="form-status"></p><button type="submit" class="primary">저장</button></form></dialog>
<dialog class="dialog-wide" id="info-dialog" aria-labelledby="info-title"><div class="dialog-head"><h2 id="info-title">상세 정보</h2><button type="button" data-close="info-dialog" aria-label="상세 닫기">✕</button></div><dl class="detail-data" id="info-data"></dl><div id="info-actions" class="booking-actions"></div></dialog>
</body></html>
