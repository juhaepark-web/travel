<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>예약 | 여행의 쉼표</title><link rel="stylesheet" href="/css/common.css"><link rel="stylesheet" href="/css/public.css"><link rel="stylesheet" href="/css/account.css"><script src="/js/common.js" defer></script><script type="module" src="/js/booking.js"></script></head><body><header class="header wrap"><a class="brand" href="/index.html">여행의 쉼표<span class="brand-dot">.</span></a><button class="menu-toggle" aria-expanded="false" aria-controls="navigation">메뉴</button><nav id="navigation" aria-label="주 메뉴"><a href="/#destinations">여행지 둘러보기</a><a href="/#stays">주변 숙소</a><a href="/#guide">이용 안내</a><div id="account-menu" class="account-menu"><a class="login" href="/html/signup.html">회원가입</a><a class="login" href="/html/login.html">로그인</a><a class="login" href="/html/admin-login.html">관리자</a></div></nav></header><main class="wrap section"><span class="eyebrow">YOUR NEXT STAY</span><h1 class="page-title">예약 신청과 내 예약</h1><p class="notice">예약 신청 후 관리자가 숙소 가능 여부를 확인해 확정합니다. 실시간 객실 재고와 온라인 결제는 제공하지 않습니다.</p><p id="booking-status" role="status">로그인 상태 확인 중…</p><div class="booking-layout" id="booking-content" hidden><section><h2>머물 곳 선택</h2><div id="booking-stays"></div></section><section><form id="booking-form"><h2>예약 신청</h2><label class="field">선택한 숙소<select id="stay-select" name="stayId" required></select></label><div class="two-column"><label class="field">체크인<input type="date" name="checkIn" required></label><label class="field">체크아웃<input type="date" name="checkOut" required></label></div><label class="field">인원<input type="number" name="guestCount" value="1" min="1" max="50" required></label><p id="booking-estimate" role="status">숙소와 날짜를 선택해 주세요.</p><p class="price-note">금액은 서버에서 검증 후 저장됩니다. 신청은 예약 확정이 아닙니다.</p><button type="submit" class="primary">예약 신청</button></form></section></div><section><div class="section-heading"><h2>내 예약</h2><button class="secondary" id="refresh-bookings">새로고침</button></div><div id="my-bookings"></div></section></main></body></html>
